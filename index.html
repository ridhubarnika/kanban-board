<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple Kanban Board</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 20px;
}

h1 {
    text-align: center;
}

.container {
    display: flex;
    gap: 20px;
    justify-content: center;
    margin-top: 20px;
}

.column {
    background: white;
    width: 300px;
    min-height: 400px;
    padding: 10px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.column h2 {
    text-align: center;
}

.card {
    background: #e3f2fd;
    padding: 10px;
    margin: 10px 0;
    border-radius: 6px;
    cursor: pointer;
}

.card:hover {
    background: #bbdefb;
}

input {
    padding: 10px;
    width: 250px;
}

button {
    padding: 10px;
    cursor: pointer;
}

.top-bar {
    text-align: center;
    margin-bottom: 20px;
}
</style>
</head>

<body>

<h1>Simple Kanban Board</h1>

<div class="top-bar">
    <input type="text" id="taskInput" placeholder="Enter task title">
    <button onclick="addTask()">Add Task</button>
</div>

<div class="container">
    <div class="column" id="todo">
        <h2>To Do</h2>
    </div>

    <div class="column" id="inprogress">
        <h2>In Progress</h2>
    </div>

    <div class="column" id="done">
        <h2>Done</h2>
    </div>
</div>

<script>
function addTask() {
    let input = document.getElementById("taskInput");
    let title = input.value.trim();

    if (title === "") return;

    let card = document.createElement("div");
    card.className = "card";
    card.innerText = title;

    card.onclick = function () {
        moveCard(card);
    };

    document.getElementById("todo").appendChild(card);
    input.value = "";
}

function moveCard(card) {
    let parent = card.parentElement.id;

    if (parent === "todo") {
        document.getElementById("inprogress").appendChild(card);
    } 
    else if (parent === "inprogress") {
        document.getElementById("done").appendChild(card);
    } 
    else {
        document.getElementById("todo").appendChild(card);
    }
}
</script>

</body>
</html>
